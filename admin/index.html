<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Fashion Crown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        /* Login-specific styles scoped to this page */
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(212,175,55,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(212,175,55,0.04) 0%, transparent 50%);
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .admin-login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(212,175,55,0.015) 40px,
                rgba(212,175,55,0.015) 41px
            );
            animation: loginPatternMove 60s linear infinite;
            pointer-events: none;
        }

        @keyframes loginPatternMove {
            0% { transform: translate(0,0); }
            100% { transform: translate(41px, 41px); }
        }

        .login-card {
            background: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 3px;
            display: block;
            margin-bottom: 0.25rem;
        }

        .login-logo .logo-divider {
            width: 50px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            margin: 0.75rem auto;
        }

        .login-heading {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: #AAAAAA;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-field {
            margin-bottom: 1.25rem;
        }

        .login-field label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: #AAAAAA;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-field .input-wrapper {
            position: relative;
        }

        .login-field .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .login-field input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            background: #111111;
            border: 1px solid #2A2A2A;
            border-radius: 10px;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }

        .login-field input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
        }

        .login-field input:focus + i,
        .login-field input:focus ~ i {
            color: #D4AF37;
        }

        .login-field .input-wrapper:focus-within i {
            color: #D4AF37;
        }

        .login-field input::placeholder {
            color: #555;
        }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #D4AF37, #B8972E);
            color: #000000;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #F0D060, #D4AF37);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(212,175,55,0.3);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-btn.loading .btn-text { display: none; }
        .login-btn.loading .spinner { display: inline-block; }

        .login-error {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: #ff6b7a;
        }

        .login-error.visible {
            display: flex;
        }

        .login-error i {
            flex-shrink: 0;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #2A2A2A;
        }

        .login-footer a {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #AAAAAA;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #D4AF37;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .login-logo .logo-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-text"><i class="fa-solid fa-crown" style="color: var(--gold, #C9A84C); margin-right: 8px;"></i>FASHION CROWN</span>
                <div class="logo-divider"></div>
            </div>
            <h1 class="login-heading">Admin Portal</h1>

            <div id="login-error" class="login-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="login-error-text">Invalid email or password.</span>
            </div>

            <form id="login-form" autocomplete="off">
                <div class="login-field">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="login-email" name="email" placeholder="admin@fashioncrown.co.ke" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <div class="login-field">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="login-btn" id="login-submit">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="login-footer">
                <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Fashion Crown</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // If already logged in, redirect to dashboard
            try {
                if (typeof window.supabaseClient !== 'undefined') {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        window.location.href = 'dashboard.html';
                        return;
                    }
                }
            } catch (e) {
                // Not logged in, stay on login page
            }

            const form = document.getElementById('login-form');
            const errorDiv = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');
            const submitBtn = document.getElementById('login-submit');

            function showError(msg) {
                errorText.textContent = msg;
                errorDiv.classList.add('visible');
            }

            function hideError() {
                errorDiv.classList.remove('visible');
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    showError('Please enter both email and password.');
                    return;
                }

                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                try {
                    if (typeof window.supabaseClient === 'undefined') {
                        throw new Error('Application not initialized. Please refresh and try again.');
                    }

                    const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        throw error;
                    }

                    if (data.session) {
                        window.location.href = 'dashboard.html';
                    } else {
                        showError('Authentication failed. Please try again.');
                    }
                } catch (err) {
                    showError(err.message || 'An error occurred. Please try again.');
                } finally {
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
